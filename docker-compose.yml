      - "5005:5005"

  ms-certificados:
    build:
      context: .
      args:
        SERVICO: ms-certificados
    environment:
      - SERVICO=ms-certificados
      - JWT_SECRET=${JWT_SECRET:40028922funkdoyudiquevaidaplaystation3}
